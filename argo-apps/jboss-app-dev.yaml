# Connects argocd to the github repostory

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jboss-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/KithupaG/K8S-Fleet-Deployment-Repo.git'
    targetRevision: HEAD
    path: apps/jboss-app/overlays/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
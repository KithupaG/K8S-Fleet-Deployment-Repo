targetCustomizationMode: AllMatches
targetCustomizations:
  - name: staging
    clusterSelector:
      matchLabels:
        staging-env: "true"
    kustomize:
      dir: overlays/staging
    namespace: staging

  - name: prod
    clusterSelector:
      matchLabels:
        prod-env: "true"
    kustomize:
      dir: overlays/prod
    namespace: prod
